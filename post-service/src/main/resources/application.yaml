server:
  port: 8083
  servlet:
    context-path: /post
spring:
  application:
    name: post-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/post-service?authSource=admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
file:
  max-size-mb: 10
  max-request-size: 20

app:
  services:
    profile:
      url: http://localhost:8081/profile
    cloudinary:
      url: http://localhost:8084/cloudinary
