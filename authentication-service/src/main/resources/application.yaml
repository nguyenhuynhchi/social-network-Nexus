server:
  port: ${AUTHENTICATION_SERVICE_PORT:8080}
  servlet:
    context-path: /authentication

spring:
  application:
    name: authentication-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://mysql:3306/authentication_service}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
jwt:
  signerKey: ${JWT_SIGNER_KEY:change-me-to-a-long-random-base64-secret}
  valid-duration: ${JWT_VALID_DURATION:36000}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000}

app:
  services:
    profile: ${PROFILE_SERVICE_URL:http://profile-service:8081/profile}
