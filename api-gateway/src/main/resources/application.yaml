server:
  port: 8888

app:
  api-prefix: /nexus/v1
  StripPrefix: 2

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: authentication_service
          uri: http://localhost:8080
          predicates:
          - Path=${app.api-prefix}/authentication/**
          filters:
          - StripPrefix=${StripPrefix}

        - id: profile_service
          uri: http://localhost:8081
          predicates:
          - Path=${app.api-prefix}/profile/users/**
          filters:
          - StripPrefix=${StripPrefix}
