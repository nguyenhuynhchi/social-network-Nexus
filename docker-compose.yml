services:
  mongodb:
    image: mongo:7.0.11
    container_name: mongodb-7.0.11
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - nexus-network

  neo4j:
    image: neo4j:latest
    container_name: neo4j-nexus
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    networks:
      - nexus-network

  mysql:
    image: mysql:8.0.41-debian
    container_name: mysql-8.0.41
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - nexus-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - nexus-network

  api-gateway:
    build: ./api-gateway
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_PORT:-8888}:${API_GATEWAY_PORT:-8888}"
    depends_on:
      - authentication-service
    networks:
      - nexus-network

  authentication-service:
    build: ./authentication-service
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      profile-service:
        condition: service_started
    ports:
      - "${AUTHENTICATION_SERVICE_PORT:-8080}:${AUTHENTICATION_SERVICE_PORT:-8080}"
    networks:
      - nexus-network

  profile-service:
    build: ./profile-service
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
      cloudinary-upload:
        condition: service_started
    ports:
      - "${PROFILE_SERVICE_PORT:-8081}:${PROFILE_SERVICE_PORT:-8081}"
    networks:
      - nexus-network

  notification-service:
    build: ./notification-service
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8082}:${NOTIFICATION_SERVICE_PORT:-8082}"
    networks:
      - nexus-network

  post-service:
    build: ./post-service
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_started
      profile-service:
        condition: service_started
      cloudinary-upload:
        condition: service_started
    ports:
      - "${POST_SERVICE_PORT:-8083}:${POST_SERVICE_PORT:-8083}"
    networks:
      - nexus-network

  cloudinary-upload:
    build: ./cloudinary-upload
    env_file:
      - .env
    ports:
      - "${CLOUDINARY_UPLOAD_PORT:-8084}:${CLOUDINARY_UPLOAD_PORT:-8084}"
    networks:
      - nexus-network

  chat-service:
    build: ./chat-service
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_started
      authentication-service:
        condition: service_started
      profile-service:
        condition: service_started
    ports:
      - "${CHAT_SERVICE_PORT:-8085}:${CHAT_SERVICE_PORT:-8085}"
      - "${CHAT_WEBSOCKET_PORT:-8099}:${CHAT_WEBSOCKET_PORT:-8099}"
    networks:
      - nexus-network

  frontend-nexus:
    build:
      context: ./frontend-nexus
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL}
        VITE_CHAT_SOCKET_URL: ${VITE_CHAT_SOCKET_URL}
    container_name: frontend-nexus
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
